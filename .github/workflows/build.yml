name: Build APK (Ultimate Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Version (Force 8.4)
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Inject Repositories Safely
        # 这是一个超级安全的脚本，它会智能识别 .gradle 和 .gradle.kts 文件并注入仓库
        shell: bash
        run: |
          # Groovy DSL 文件注入规则
          sed -i '/^$/d' . 2>/dev/null || true
          GROOVY_INJECT=$(cat <<EOF

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          )
          
          # 遍历所有 build.gradle 文件
          for file in $(find . -name "build.gradle"); do
            echo "Processing Groovy file: $file"
            if ! grep -q "google()" "$file" 2>/dev/null; then
              echo "$GROOVY_INJECT" >> "$file"
            fi
          done

          # Kotlin DSL 文件注入规则
          KOTLIN_INJECT=$(cat <<EOF

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF
          )

          # 遍历所有 build.gradle.kts 文件
          for file in $(find . -name "build.gradle.kts"); do
            echo "Processing Kotlin file: $file"
            if ! grep -q "google()" "$file" 2>/dev/null; then
              echo "$KOTLIN_INJECT" >> "$file"
            fi
          done

      - name: Force Clean and Purge Cache
        # 彻底清理项目旧文件和云端缓存，防止脏构建
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          gradle clean --no-daemon --stacktrace

      - name: Build APK (Release Build)
        # 开始正式编译，带有详细的错误堆栈输出
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug-ultimate
          path: app/build/outputs/apk/debug/app-debug.apk
