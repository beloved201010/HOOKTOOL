name: Build APK (Final Safe Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Set Gradle Version
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Add Repositories Safely (Auto-append)
        run: |
          # 1. 定义要补充的标准仓库代码
          APPEND_BLOCK=$(cat <<'EOF'
          
          // Auto-added repositories for CI build
          allprojects {
              repositories {
                  google()
                  mavenCentral()
                  maven { url = 'https://jitpack.io' }
              }
          }
          EOF
          )
          
          # 2. 遍历项目中的所有 build.gradle 文件
          for file in $(find . -name "build.gradle" -not -path './.gradle/*'); do
            # 3. 检查文件里有没有 google()，如果没有，直接在文件末尾把仓库代码追加进去
            if ! grep -q "google()" "$file"; then
              echo "$APPEND_BLOCK" >> "$file"
              echo "Successfully added repositories to $file"
            else
              echo "Repositories already exist in $file, skipping."
            fi
          done

      - name: Clean and Build APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug-final
          path: app/build/outputs/apk/debug/app-debug.apk
