name: Build APK (Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Version (Force 8.4)
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Inject Repositories (Smart Replace)
        shell: bash
        run: |
          # 针对 Groovy DSL (.gradle) 文件的替换逻辑
          # 删除原有的 repositories 闭包，然后用一个全新的、无冲突的 allprojects 块替换
          for file in $(find . -name "build.gradle" ! -path "*/node_modules/*"); do
            if [ -f "$file" ]; then
              # 先删除原有的 repositories 块，防止冲突
              sed -i '/^[[:space:]]*repositories[[:space:]]*{/,/^[[:space:]]*}/d' "$file"
              # 在文件末尾追加全局仓库配置
              echo "" >> "$file"
              echo "allprojects {" >> "$file"
              echo "    repositories {" >> "$file"
              echo "        google()" >> "$file"
              echo "        mavenCentral()" >> "$file"
              echo "    }" >> "$file"
              echo "}" >> "$file"
            fi
          done

          # 针对 Kotlin DSL (.gradle.kts) 文件的替换逻辑
          for file in $(find . -name "build.gradle.kts" ! -path "*/node_modules/*"); do
            if [ -f "$file" ]; then
              # 先删除原有的 repositories 块，防止冲突
              sed -i '/^[[:space:]]*repositories[[:space:]]*{/,/^[[:space:]]*}/d' "$file"
              # 在文件末尾追加全局仓库配置
              echo "" >> "$file"
              echo "allprojects {" >> "$file"
              echo "    repositories {" >> "$file"
              echo "        google()" >> "$file"
              echo "        mavenCentral()" >> "$file"
              echo "    }" >> "$file"
              echo "}" >> "$file"
            fi
          done

      - name: Force Clean and Purge Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          gradle clean --no-daemon --stacktrace

      - name: Build APK (Release Build)
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug-final
          path: app/build/outputs/apk/debug/app-debug.apk
