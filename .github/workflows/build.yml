name: Build APK (Bulletproof)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Version (Force 8.4)
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Inject Repositories (Safe & Simple)
        shell: bash
        run: |
          # 定义要追加的文本
          INJECT_TEXT="allprojects { repositories { google(); mavenCentral() } }"
          
          # 查找并遍历所有的 build.gradle 和 build.gradle.kts 文件
          for file in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            # 检查文件内容是否已经包含 repositories，如果没有，则在末尾追加一行
            if ! grep -q "repositories" "$file"; then
              echo "$INJECT_TEXT" >> "$file"
              echo "Injected repositories into $file"
            fi
          done

      - name: Force Clean and Purge Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          gradle clean --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug-safe
          path: app/build/outputs/apk/debug/app-debug.apk
