name: Build APK (Xposed Final Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Version (Force 8.4)
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Inject Xposed Repositories (Smart Inject)
        shell: bash
        run: |
          # 针对所有 Gradle 配置文件，将 jitpack.io 仓库智能插入到 repositories 块中
          for file in $(find . -name "build.gradle" -o -name "build.gradle.kts"); do
            echo "Processing: $file"
            # 检查是否已经包含 jitpack.io，如果没有，则在 repositories { 的下一行强制插入
            if ! grep -q "jitpack.io" "$file"; then
              # 使用 perl 进行安全的替换
              perl -i -pe 's/repositories\s*\{/repositories {\n        maven { url "https://jitpack.io" }\n/g' "$file"
            fi
          done

      - name: Force Clean and Purge Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          gradle clean --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug-xposed
          path: app/build/outputs/apk/debug/app-debug.apk
