name: Build APK (Command Line Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Version (Force 8.4)
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Force Clean and Purge Cache
        run: |
          rm -rf ~/.gradle/caches/
          rm -rf .gradle/
          gradle clean --no-daemon --stacktrace

      - name: Build APK (Hardcoded Repos)
        # 直接在命令行里用 -P 参数把仓库地址塞给 Gradle，彻底绕过项目文件的配置
        run: gradle assembleDebug -Pallprojects.repositories="google(), mavenCentral(), maven { url 'https://jitpack.io' }" --no-daemon --stacktrace --info

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug-cli
          path: app/build/outputs/apk/debug/app-debug.apk
