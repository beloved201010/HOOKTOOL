name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Force Gradle Version
        run: |
          curl -L "https://services.gradle.org/distributions/gradle-8.4-bin.zip" -o gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Force clean
        run: gradle clean --no-daemon

      - name: Build APK
        # 在命令行里强行指定 Google 和 Maven 仓库，确保云端能下载到依赖
        run: gradle assembleDebug --no-daemon --stacktrace -Pallprojects.repositories=google(),mavenCentral()

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hooktool-debug
          path: app/build/outputs/apk/debug/app-debug.apk
